# 4-monitor hangar desk (Ryzen 7 8700F + RTX 5060 Ti).
# xrandr layout observed on the box:
#   DP-4    +0       debug / IOS
#   DP-3    +1920    left visual
#   HDMI-0  +3840    front visual
#   DP-0    +5760    right visual
# One X screen (7680×1080). Pin windows with window_x; do not rely on
# separate X screens. Same ViewAngles as the original three RSI channels.
# The IOS view is the same eyepoint, pitched down, so the instructor sees
# more of the field — not a second ownship.
#
# Never set allow_sim_lan here. Copy to config/local.toml for the IG PC.

[host]
bind = "0.0.0.0:2300"
reply_port = 2301
word_order = "auto"
float_format = "auto"
hat_responder = true
allow_sim_lan = false
allow_lan = false

[render]
engine = "auto"
earth_file = "data/earth/ksea.earth"
cache_dir = "cache/ksea"
frame_rate = 60
window_title = "s376-visual"
vsync = true
msaa = 4
aniso = 16

[log]
verbose = false
debug = false
dir = "logs"

[[channels]]
name = "ios"
heading_offset_deg = 0.0
pitch_offset_deg = -18.0
roll_offset_deg = 0.0
hfov_deg = 60.0
vfov_deg = 36.0
monitor = 0
width = 1920
height = 1080
window_x = 0
window_y = 0
fullscreen = false
enabled = true

[[channels]]
name = "left"
heading_offset_deg = 35.515
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
monitor = 0
width = 1920
height = 1080
window_x = 1920
window_y = 0
fullscreen = false
enabled = true

[[channels]]
name = "front"
heading_offset_deg = 0.0
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
monitor = 0
width = 1920
height = 1080
window_x = 3840
window_y = 0
fullscreen = false
enabled = true

[[channels]]
name = "right"
heading_offset_deg = -35.25
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
monitor = 0
width = 1920
height = 1080
window_x = 5760
window_y = 0
fullscreen = false
enabled = true
