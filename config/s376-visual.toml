# s376-visual — default hangar config.
# Copy to config/local.toml (gitignored) for machine-specific ports / LAN flags.
#
# Simulator LANs 10.1.95.0/24 and 192.168.173.0/24 are refused as destinations
# unless allow_sim_lan is true (production IG PC only). Tests and CI never set it.

[host]
bind = "0.0.0.0:2300"
reply_port = 2301
word_order = "auto"       # auto | le | be
float_format = "auto"     # auto | vax | ieee
hat_responder = true
allow_sim_lan = false
allow_lan = false

[render]
engine = "auto"           # auto | osgearth | osg | null
earth_file = "data/earth/s376.earth"
cache_dir = ""
frame_rate = 60
window_title = "s376-visual"
vsync = true

[log]
verbose = false
debug = false
dir = "logs"

# Three RSI Raster XT4 channels from the 737-300 site file.
# v0.1 opens one window (--channel front|left|right). All three are described
# so a later CompositeViewer pass can open them together.

[[channels]]
name = "front"
heading_offset_deg = 0.0
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
monitor = 0
width = 1920
height = 1080
fullscreen = false
enabled = true

[[channels]]
name = "left"
heading_offset_deg = 35.515
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
monitor = 1
width = 1920
height = 1080
fullscreen = false
enabled = true

[[channels]]
name = "right"
heading_offset_deg = -35.25
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
monitor = 2
width = 1920
height = 1080
fullscreen = false
enabled = true
