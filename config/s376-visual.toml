# s376-visual — default projector-PC config.
# Copy to config/local.toml (gitignored) for machine-specific ports / LAN flags.
#
# Collimated cross-cockpit display. Four projectors, four PCs, Raster's
# THREE channels (startup log: front 0 / left +35.515 / right −35.25,
# 50×32.5). Captain sees far_left + mid_left; FO sees mid_right + far_right
# (mirrors hide the other side). The two middle projectors show the SAME
# front view — a duplicated front channel, not a split.
#
#   far_left  PC  = Raster left   (+35.515)
#   mid_left  PC  = Raster front  (0)      captain
#   mid_right PC  = Raster front  (0)      FO duplicate
#   far_right PC  = Raster right  (−35.25)
#
# Each PC:
#   s376-visual --config config/s376-visual.toml --channel mid_left
#   # or S376_CHANNEL=mid_left
# Aliases: left→far_left, front→mid_left, right→far_right, front_fo→mid_right
#
# All four bind UDP 2300 and consume the same xT4 stream (host broadcast /
# multicast / fan-out). Only reply_master sends the type-200 HAT reply.
#
# Laptop 3-window alternative: config/channels-3.toml
# One-PC 4-monitor hangar desk: config/desk-4monitor.toml
#
# Simulator LANs 10.1.95.0/24 and 192.168.173.0/24 are refused as destinations
# unless allow_sim_lan is true (production IG PC only). Tests and CI never set it.

[host]
bind = "0.0.0.0:2300"
reply_port = 2301
word_order = "auto"       # auto | le | be
float_format = "auto"     # auto | vax | ieee
hat_responder = true
reply_master = "mid_left" # only this --channel sends HAT; others listen
allow_sim_lan = false
allow_lan = false

[render]
engine = "auto"           # auto | osgearth | osg | null
earth_file = "data/earth/s376.earth"
cache_dir = ""            # packed region from s376-cache; empty = synth KSEA DEM
frame_rate = 60
window_title = "s376-visual"
vsync = true
msaa = 4                  # 4x MSAA; one 980 Ti channel can do 8
aniso = 16
quality = "gtx980ti"      # gtx980ti | rtx | custom
# gtx980ti: one channel on 6 GB Maxwell — hdr/atmosphere/water/markings/detail/
# buildings/ssao on; shadows off (CSM not drawn yet)
sync_to_host = true       # draw only when a new type-100 eyepoint arrives

[log]
verbose = false
debug = false
dir = "logs"

# Production: one process per PC via --channel <name>.
# Laptop: omit --channel (or --channel all) to tile all four.

[[channels]]
name = "far_left"             # Raster left — captain outboard
heading_offset_deg = 35.515
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
monitor = 0
width = 1920
height = 1080
fullscreen = false
enabled = true

[[channels]]
name = "mid_left"             # Raster front — captain inboard
heading_offset_deg = 0.0
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
monitor = 1
width = 1920
height = 1080
fullscreen = false
enabled = true

[[channels]]
name = "mid_right"            # Raster front — FO inboard (duplicate)
heading_offset_deg = 0.0
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
# Optional FO seat offset (metres, aircraft body). 0 = same eye as mid_left.
# eye_right_m = 0.51
# eye_fwd_m = 0.0
# eye_up_m = 0.0
monitor = 2
width = 1920
height = 1080
fullscreen = false
enabled = true

[[channels]]
name = "far_right"            # Raster right — FO outboard
heading_offset_deg = -35.25
pitch_offset_deg = 0.0
roll_offset_deg = 0.0
hfov_deg = 50.0
vfov_deg = 32.5
# Same optional FO offset as mid_right if you enable a per-seat eye.
# eye_right_m = 0.51
monitor = 3
width = 1920
height = 1080
fullscreen = false
enabled = true
