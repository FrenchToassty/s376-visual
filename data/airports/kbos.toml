# KBOS — public geometry only.
# Runway ends / lengths / widths: OurAirports runways.csv (public domain).
# Lighting systems from the published FAA chart (ALSF-2 on 04R/15R,
# MALSR on 04L/33L/27). Taxi / apron connectors in the binary are schematic
# offsets; replace with `s376-cache osm KBOS` (Overpass aeroway=* + building=*,
# ODbL). Packet-112 switch numbers are ours, not RSI's.
#
# Joey's Raster 4R daytime photo may be this field (hdg 35°, 10006×150,
# ALSF-2) or KJFK 04R (hdg 31°, 8400×200, MALSR). Compare with
# `s376-visual --screenshot /tmp/bos-04r.ppm --at KBOS:04R:0 --channel mid_left`.

icao = "KBOS"
name = "Boston Logan International"
arp_lat = 42.3656
arp_lon = -71.0096
