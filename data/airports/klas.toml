# KLAS — public geometry only.
# Runway ends / lengths / widths: OurAirports runways.csv (public domain).
# Lighting systems from the published FAA chart (ALSF-2 on 26R and 26L,
# MALSR on the 08s and 19s). Taxi / apron connectors in the binary are
# schematic offsets; replace with `s376-cache osm KLAS` (Overpass
# aeroway=*, ODbL) when you want the real graph.
# Packet-112 switch numbers are ours, not RSI's.

