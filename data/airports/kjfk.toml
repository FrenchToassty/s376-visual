# KJFK — public geometry only.
# Runway ends / lengths / widths: OurAirports runways.csv (public domain).
# Lighting systems from the published FAA chart (ALSF-2 on 04L/22R/13L/13R/31L,
# MALSR on 04R/31R). Taxi / apron connectors in the binary are schematic
# offsets; replace with `s376-cache osm KJFK` (Overpass aeroway=*, ODbL).
# Packet-112 switch numbers are ours, not RSI's.

