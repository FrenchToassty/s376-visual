# KSFO — public geometry only.
# Runway ends / lengths / widths: OurAirports runways.csv (public domain).
# Lighting systems from the published FAA chart (ALSF-2 on 28R, MALSR on
# 10L / 28L / 19L / 10R and the 01s). Taxi / apron connectors in the
# binary are schematic offsets; replace with `s376-cache osm KSFO`
# (Overpass aeroway=*, ODbL) when you want the real graph.
# Packet-112 switch numbers are ours, not RSI's.

