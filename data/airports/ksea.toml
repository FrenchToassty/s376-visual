# KSEA — public geometry only.
# Runway ends / lengths / widths: OurAirports runways.csv (public domain).
# 16L threshold matches the s376-synth takeoff. Lighting systems from the
# published FAA chart (ALSF-2 on 16L, MALSR on the other instrument ends).
# Taxi connectors in the binary are schematic offsets from those runways;
# replace with an Overpass aeroway=* pull (ODbL) when the generator lands.
# Packet-112 switch numbers are ours, not RSI's.

