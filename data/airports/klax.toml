# KLAX — public geometry only.
# Runway ends / lengths / widths: OurAirports runways.csv (public domain).
# Lighting systems from the published FAA chart (ALSF-2 on 24R/24L/25R/25L,
# MALSR on the 06s and 07s). Taxi / apron connectors in the binary are
# schematic offsets; replace with `s376-cache osm KLAX` (Overpass
# aeroway=*, ODbL) when you want the real graph.
# Packet-112 switch numbers are ours, not RSI's.

