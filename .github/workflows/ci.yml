name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libopenscenegraph-dev libgl-dev libglew-dev libgdal-dev xvfb
      - name: scripts syntax
        run: |
          bash -n scripts/setup-mint.sh
          bash -n scripts/build-osgearth.sh
          bash -n scripts/fetch-textures.sh
          ./scripts/setup-mint.sh --dry-run --skip-apt --no-desktop | head
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: build
        run: cmake --build build -j $(nproc)
      - name: unit tests
        run: |
          unset S376_ALLOW_SIM_LAN
          unset S376_ALLOW_LAN
          ctest --test-dir build --output-on-failure
      - name: doctor
        run: |
          ./build/s376-cache synth-ksea --out cache/ksea --size 32
          ./build/s376-doctor -c config/s376-visual.toml
      - name: headless demo (loopback only)
        run: |
          ./build/s376-visual --headless --demo --duration 2 --bind 127.0.0.1:2300 -c config/s376-visual.toml
          ./build/s376-visual --headless --demo-weather --duration 2 --bind 127.0.0.1:2300 -c config/s376-visual.toml
          ./build/s376-visual --headless --at KJFK:04R:0 --duration 0.3 --bind 127.0.0.1:2300 -c config/s376-visual.toml
          ./build/s376-visual --headless --at KBOS:04R:3 --quality rtx --duration 0.3 --bind 127.0.0.1:2300 -c config/s376-visual.toml
          ./build/s376-visual --headless --channel far_left --duration 0.3 --bind 127.0.0.1:2300 -c config/s376-visual.toml
          ./build/s376-visual --headless --channel mid_left --duration 0.3 --bind 127.0.0.1:2300 -c config/s376-visual.toml
          ./build/s376-visual --headless --demo --duration 0.3 --bind 127.0.0.1:2300 -c config/channels-3.toml
      - name: SIGTERM stops the IG
        run: |
          set +e
          timeout -k 2 3 ./build/s376-visual --headless --demo --duration 3600 --bind 127.0.0.1:2300 -c config/s376-visual.toml
          rc=$?
          set -e
          # 124 = SIGTERM honored; 137 = timeout had to SIGKILL
          if [ "$rc" -eq 137 ]; then
            echo "IG ignored SIGTERM" >&2
            exit 1
          fi
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "unexpected exit $rc" >&2
            exit 1
          fi
      - name: no OpenGL error spam
        run: |
          ./build/s376-visual --headless --demo --duration 2 --bind 127.0.0.1:2300 -c config/s376-visual.toml \
            > /tmp/s376-headless.log 2>&1
          if grep -F "detected OpenGL error" /tmp/s376-headless.log; then
            echo "GL errors in headless log" >&2
            exit 1
          fi
          xvfb-run -a ./build/s376-visual --demo --duration 2 --channel mid_left -c config/s376-visual.toml \
            > /tmp/s376-xvfb.log 2>&1 || true
          if grep -F "detected OpenGL error" /tmp/s376-xvfb.log; then
            echo "GL errors in xvfb log" >&2
            exit 1
          fi
      - name: refuse sim LAN
        run: |
          if ./build/s376-synth --dest 10.1.95.1:2300 --duration 0.1; then
            echo "synth must refuse the sim LAN" >&2
            exit 1
          fi
          if ./build/s376-synth --dest 192.168.173.10:2300 --duration 0.1; then
            echo "synth must refuse the visual LAN" >&2
            exit 1
          fi
      - name: offline tile cache
        run: |
          ./build/s376-cache synth-ksea --out /tmp/s376-ci-ksea --size 64 --lods
          ./build/s376-cache info /tmp/s376-ci-ksea
          ./build/s376-cache fetch KSEA --dry-run --out /tmp/s376-ci-ksea | head
          ./build/s376-cache osm KSFO --dry-run | head
          if ./build/s376-cache synth-ksea --out 10.1.95.1:2300; then
            echo "cache must refuse a sim-LAN dest" >&2
            exit 1
          fi
          if ./build/s376-cache fetch KSEA --dry-run --out 10.1.95.1:2300; then
            echo "fetch must refuse a sim-LAN dest" >&2
            exit 1
          fi
